version: '3.6'
services:
  app:
    image: jrwf/php-8-2-apache:0.0.9
    container_name: iordinace-app
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./.docker/php/php.ini:/usr/local/etc/php/php.ini
      - ./.docker/apache/000-default.conf:/etc/apache2/sites-enabled/000-default.conf
    working_dir: /var/www/html
    environment:
      XDEBUG_MODE: debug
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - database

  database:
    container_name: iordinace-mysql
    image: mysql:8.0.32
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: iordinace
    ports:
      - "3306:3306"
    volumes:
      - ./.docker/mysql:/var/lib/mysql

  adminer:
    container_name: iordinace-adminer
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - database

